name: Bug report
description: Something in the forge does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issue, such as a way to bypass a gate? Do not file it here: see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Minimal steps or script. Use generated test values, never real secrets.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, git and gitleaks versions, AI client and version if relevant.

# AI-dev-forge gates. Make both jobs required checks in the branch protection of main.
name: forge-gates

on:
  push: # every branch: anything published gets checked
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA; tags can be moved.
# Pin any action you add (setup-python, setup-node, ...) the same way.

concurrency:
  group: forge-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history for gitleaks and the identity check
      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks && sudo mv gitleaks /usr/local/bin/
      - name: Secrets gate
        run: ./scripts/check_secrets.sh
      - name: Secrets gate on the pushed tag (message and tagger identity)
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin "+$GITHUB_REF:$GITHUB_REF" # the tag object itself, not only its commit
          ./scripts/check_secrets.sh "$GITHUB_REF"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # TODO: set up your toolchain here (actions/setup-python, actions/setup-node, ...).
      - name: Quality gate
        run: ./scripts/check.sh
